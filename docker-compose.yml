services:
  nginx:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: ${PROXY_NAME}
    depends_on:
      - ${FRONTEND_NAME}
      - ${AUTH_SERVICE_NAME}
      - ${GAME_SERVICE_NAME}
      - ${REALTIME_GATEWAY_NAME}
    environment:
      - FRONT_HOST=${FRONTEND_NAME}:${FRONTEND_PORT}
      - AUTH_HOST=${AUTH_SERVICE_NAME}:${AUTH_PORT}
      - GAME_HOST=${GAME_SERVICE_NAME}:${GAME_PORT}
      - REALTIME_GATEWAY_HOST=${REALTIME_GATEWAY_NAME}:${REALTIME_GATEWAY_PORT}
      - FRONT_PATH=${FRONT_PATH}
      - AUTH_PATH=${AUTH_PATH}
      - GAMES_PATH=${GAMES_PATH}
      - WS_PATH=${WS_PATH}
    # for prod -----------------------------------------------
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=traefik_proxy"
    #   - "traefik.http.services.nginx.loadbalancer.server.port=80"
    #   - "traefik.http.routers.nginx-secure.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.nginx-secure.entrypoints=websecure"
    #   - "traefik.http.routers.nginx-secure.tls.certresolver=myresolver"
    #   - "traefik.http.routers.nginx-secure.tls=true"
    #   - "traefik.http.routers.nginx-web.rule=Host(`${DOMAIN}`)"
    #   - "traefik.http.routers.nginx-web.entrypoints=web"
    #   - "traefik.http.routers.nginx-web.middlewares=redirect-to-https"
    #   - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    #   - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    # networks:
    #   - traefik_proxy
    #   - internal
    # for dev ------------------------------------------------
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - internal

  frontend:
    build:
      context: ./services
      dockerfile: front/dockerfile
    container_name: ${FRONTEND_NAME}
    expose:
      - "${FRONTEND_PORT}"
    environment:
      - PORT=${FRONTEND_PORT}
      - DOMAIN=${DOMAIN}
      - FRONT_HOST=${FRONTEND_NAME}:${FRONTEND_PORT}
      - AUTH_HOST=${AUTH_SERVICE_NAME}:${AUTH_PORT}
      - GAME_HOST=${GAME_SERVICE_NAME}:${GAME_PORT}
      - REALTIME_GATEWAY_HOST=${REALTIME_GATEWAY_NAME}:${REALTIME_GATEWAY_PORT}
      - AUTH_PATH=${AUTH_PATH}
      - GAMES_PATH=${GAMES_PATH}
      - WS_PATH=${WS_PATH}
    networks:
      - internal

  auth_service:
    build:
      context: ./services/auth
      dockerfile: dockerfile
    container_name: ${AUTH_SERVICE_NAME}
    depends_on:
      - ${POSTGRES_HOST}
    expose:
      - "${AUTH_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${AUTH_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
    networks:
      - internal

  # matchmaking_service:
  #   build:
  #     context: ./services/matchmaking
  #     dockerfile: dockerfile
  #   container_name: ${MATCHMAKING_SERVICE_NAME}
  #   depends_on:
  #     - ${REDIS_HOST}
  #   expose:
  #     - "${MATCHMAKING_SERVICE_PORT}"
  #   environment:
  #     - NODE_ENV=${NODE_ENV}
  #     - PORT=${MATCHMAKING_SERVICE_PORT}
  #     - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
  #   networks:
  #     - internal

  game_service:
    build:
      context: ./services
      dockerfile: games/dockerfile
    container_name: ${GAME_SERVICE_NAME}
    depends_on:
      - ${REDIS_HOST}
    expose:
      - "${GAME_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${GAME_PORT}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
    networks:
      - internal

  realtime_gateway:
    build:
      context: ./services
      dockerfile: realtime-gateway/dockerfile
    container_name: ${REALTIME_GATEWAY_NAME}
    depends_on:
      - ${AUTH_SERVICE_NAME}
      - ${GAME_SERVICE_NAME}
      - ${REDIS_HOST}
    expose:
      - ${REALTIME_GATEWAY_PORT}
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${REALTIME_GATEWAY_PORT}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
      - AUTH_HOST=http://${AUTH_SERVICE_NAME}:${AUTH_PORT}
      - GAME_HOST=http://${GAME_SERVICE_NAME}:${GAME_PORT}
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_HOST}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - internal
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST}
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - internal

networks:
  traefik_proxy:
    external: true
  internal:
    driver: bridge
