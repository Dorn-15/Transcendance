services:
  nginx:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: ${PROXY_NAME}
    depends_on:
      - ${FRONTEND_NAME}
      - ${AUTH_SERVICE_NAME}
      - ${SOCIAL_SERVICE_NAME}
      - ${GAME_SERVICE_NAME}
      - ${REALTIME_GATEWAY_NAME}
      # - ${ROOM_SERVICE_NAME}
      #- ${MATCHMAKING_SERVICE_NAME}
    environment:
      - FRONT_HOST=${FRONTEND_NAME}:${FRONTEND_PORT}
      - AUTH_HOST=${AUTH_SERVICE_NAME}:${AUTH_PORT}
      - SOCIAL_HOST=${SOCIAL_SERVICE_NAME}:${SOCIAL_PORT}
      - GAME_HOST=${GAME_SERVICE_NAME}:${GAME_PORT}
      - REALTIME_GATEWAY_HOST=${REALTIME_GATEWAY_NAME}:${REALTIME_GATEWAY_PORT}
      - ROOM_HOST=${ROOM_SERVICE_NAME}:${ROOM_PORT}
      - MATCHMAKING_HOST=${MATCHMAKING_SERVICE_NAME}:${MATCHMAKING_PORT}
      - FRONT_PATH=${FRONT_PATH}
      - AUTH_PATH=${AUTH_PATH}
      - SOCIAL_PATH=${SOCIAL_PATH}
      - GAMES_PATH=${GAMES_PATH}
      - ROOM_PATH=${ROOM_PATH}
      - MATCHMAKING_PATH=${MATCHMAKING_PATH}
      - WS_PATH=${WS_PATH}
    # for prod -----------------------------------------------
    # labels:
    #   - "traefik.enable=true"
    #   - "traefik.docker.network=traefik_proxy"
    #   - "traefik.http.services.nginx.loadbalancer.server.port=80"
    #   - "traefik.http.routers.nginx-secure.rule=Host(`transcendance.adoireau.design`)"
    #   - "traefik.http.routers.nginx-secure.entrypoints=websecure"
    #   - "traefik.http.routers.nginx-secure.tls.certresolver=myresolver"
    #   - "traefik.http.routers.nginx-secure.tls=true"
    #   - "traefik.http.routers.nginx-web.rule=Host(`transcendance.adoireau.design`)"
    #   - "traefik.http.routers.nginx-web.entrypoints=web"
    #   - "traefik.http.routers.nginx-web.middlewares=redirect-to-https"
    #   - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"
    #   - "traefik.http.middlewares.redirect-to-https.redirectscheme.permanent=true"
    # networks:
    #   - traefik_proxy
    #   - internal
    # for dev ------------------------------------------------
    ports:
      - "8080:80"
      - "8443:443"
    networks:
      - internal

  frontend:
    build:
      context: ./services/front
      dockerfile: dockerfile
    container_name: ${FRONTEND_NAME}
    expose:
      - "${FRONTEND_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${FRONTEND_PORT}
      - DOMAIN=${DOMAIN}
      - FRONT_HOST=${FRONTEND_NAME}:${FRONTEND_PORT}
      - AUTH_HOST=${AUTH_SERVICE_NAME}:${AUTH_PORT}
      - SOCIAL_HOST=${SOCIAL_SERVICE_NAME}:${SOCIAL_PORT}
      - GAME_HOST=${GAME_SERVICE_NAME}:${GAME_PORT}
      - REALTIME_GATEWAY_HOST=${REALTIME_GATEWAY_NAME}:${REALTIME_GATEWAY_PORT}
      - AUTH_PATH=${AUTH_PATH}
      - SOCIAL_PATH=${SOCIAL_PATH}
      - GAMES_PATH=${GAMES_PATH}
      - WS_PATH=${WS_PATH}
    networks:
      - internal

  auth_service:
    build:
      context: ./services/auth
      dockerfile: dockerfile
    container_name: ${AUTH_SERVICE_NAME}
    depends_on:
      - ${POSTGRES_HOST}
    expose:
      - "${AUTH_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${AUTH_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
    networks:
      - internal

  social_service:
    build:
      context: ./services/social
      dockerfile: dockerfile
    container_name: ${SOCIAL_SERVICE_NAME}
    depends_on:
      - ${POSTGRES_HOST}
      - ${REDIS_HOST}
    expose:
      - "${SOCIAL_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${SOCIAL_PORT}
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
    networks:
      - internal

  # room_service:
  #   build:
  #     context: ./services/room
  #     dockerfile: dockerfile
  #   container_name: ${ROOM_SERVICE_NAME}
  #   depends_on:
  #     - ${POSTGRES_HOST}
  #   expose:
  #     - "${ROOM_SERVICE_PORT}"
  #   environment:
  #     - NODE_ENV=production
  #     - PORT=4003
  #     - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
  #   networks:
  #     - internal

  # matchmaking_service:
  #   build:
  #     context: ./services/matchmaking
  #     dockerfile: dockerfile
  #   container_name: ${MATCHMAKING_SERVICE_NAME}
  #   depends_on:
  #     - ${REDIS_HOST}
  #     - ${ROOM_SERVICE_NAME}
  #   expose:
  #     - "${MATCHMAKING_SERVICE_PORT}"
  #   environment:
  #     - NODE_ENV=${NODE_ENV}
  #     - PORT=${MATCHMAKING_SERVICE_PORT}
  #     - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
  #   networks:
  #     - internal

  game_service:
    build:
      context: ./services/games
      dockerfile: dockerfile
    container_name: ${GAME_SERVICE_NAME}
    depends_on:
      - ${REDIS_HOST}
    expose:
      - "${GAME_PORT}"
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${GAME_PORT}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
    networks:
      - internal

  realtime_gateway:
    build:
      context: ./services/realtime-gateway
      dockerfile: dockerfile
    container_name: ${REALTIME_GATEWAY_NAME}
    depends_on:
      - ${AUTH_SERVICE_NAME}
      - ${SOCIAL_SERVICE_NAME}
      - ${GAME_SERVICE_NAME}
      - ${REDIS_HOST}
      # - ${ROOM_SERVICE_NAME}
      # - ${MATCHMAKING_SERVICE_NAME}
    expose:
      - ${REALTIME_GATEWAY_PORT}
    environment:
      - NODE_ENV=${NODE_ENV}
      - PORT=${REALTIME_GATEWAY_PORT}
      - REDIS_URL=redis://${REDIS_HOST}:${REDIS_PORT}
      - AUTH_HOST=http://${AUTH_SERVICE_NAME}:${AUTH_PORT}
      - SOCIAL_HOST=http://${SOCIAL_SERVICE_NAME}:${SOCIAL_PORT}
      - GAME_HOST=http://${GAME_SERVICE_NAME}:${GAME_PORT}
      - ROOM_HOST=http://${ROOM_SERVICE_NAME}:${ROOM_PORT}
      - MATCHMAKING_HOST=http://${MATCHMAKING_SERVICE_NAME}:${MATCHMAKING_PORT}
    networks:
      - internal

  postgres:
    image: postgres:15-alpine
    container_name: ${POSTGRES_HOST}
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    networks:
      - internal

  redis:
    image: redis:7-alpine
    container_name: ${REDIS_HOST}
    command:
      - redis-server
      - --appendonly
      - "yes"
    networks:
      - internal
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/prometheus/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - internal
    depends_on:
      - postgres-exporter
      - redis-exporter
      - node-exporter

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_SECURITY_SECRET_KEY=${GRAFANA_SECRET_KEY:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_SERVER_DOMAIN=localhost
      - GF_AUTH_ANONYMOUS_ENABLED=false
      - GF_SECURITY_DISABLE_GRAVATAR=true
      - GF_INSTALL_PLUGINS=
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - internal
    depends_on:
      - prometheus
  node-exporter:
    image: prom/node-exporter:latest
    container_name: node-exporter
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "9100:9100"
    networks:
      - internal

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: postgres-exporter
    restart: unless-stopped
    environment:
      - DATA_SOURCE_NAME=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}?sslmode=disable
    ports:
      - "9187:9187"
    networks:
      - internal
    depends_on:
      - postgres

  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: redis-exporter
    restart: unless-stopped
    environment:
      - REDIS_ADDR=redis://${REDIS_HOST}:${REDIS_PORT}
    ports:
      - "9121:9121"
    networks:
      - internal
    depends_on:
      - redis

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    restart: unless-stopped
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ./monitoring/alertmanager/config.yml:/etc/alertmanager/config.yml:ro
      - alertmanager_data:/alertmanager
    ports:
      - "9093:9093"
    networks:
      - internal
    depends_on:
      - prometheus

volumes:
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  traefik_proxy:
    external: true
  internal:
    driver: bridge
