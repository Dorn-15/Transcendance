global:
  resolve_timeout: 5m
  # SMTP configuration
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '${ALERTMANAGER_EMAIL}'
  smtp_auth_username: '${ALERTMANAGER_EMAIL}'
  smtp_auth_password: '${ALERTMANAGER_SMTP_PASSWORD}'
  smtp_require_tls: true

route:
  receiver: 'default-email'
  group_by: ['alertname', 'cluster', 'service', 'component']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    # Critical alerts - highest priority
    - match:
        severity: critical
      receiver: 'critical-email'
      group_wait: 5s
      group_interval: 5s
      repeat_interval: 1h
      continue: true
    # Service availability alerts
    - match:
        component: availability
      receiver: 'service-email'
      continue: true
    # Database alerts
    - match:
        component: database
      receiver: 'database-email'
      continue: true
    # Cache/Redis alerts
    - match:
        component: cache
      receiver: 'cache-email'
      continue: true
    # System resource alerts
    - match:
        component: system
      receiver: 'system-email'
      continue: true
    # Performance alerts
    - match:
        component: performance
      receiver: 'performance-email'
      continue: true
    # Error rate alerts
    - match:
        component: errors
      receiver: 'errors-email'
      continue: true
    # WebSocket alerts
    - match:
        component: websocket
      receiver: 'websocket-email'
      continue: true
    # Web server alerts
    - match:
        component: web-server
      receiver: 'service-email'
      continue: true

receivers:
  - name: 'default-email'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[Transcendance] Alert: {{ .GroupLabels.alertname }}'
        html: |
          <h2>Alert Details</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Service:</strong> {{ .GroupLabels.service }}</p>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          <p><strong>Severity:</strong> {{ .GroupLabels.severity }}</p>
          <hr>
          {{ range .Alerts }}
          <h3>{{ .Annotations.summary }}</h3>
          <p>{{ .Annotations.description }}</p>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ end }}

  - name: 'critical-email'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL}'
        send_resolved: true
        headers:
          Subject: '🚨 CRITICAL: Transcendance - {{ .GroupLabels.alertname }}'
        html: |
          <h2 style="color: red;">🚨 CRITICAL ALERT</h2>
          <p><strong>Alert:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>Service:</strong> {{ .GroupLabels.service }}</p>
          <p><strong>Component:</strong> {{ .GroupLabels.component }}</p>
          <hr>
          {{ range .Alerts }}
          <h3>{{ .Annotations.summary }}</h3>
          <p>{{ .Annotations.description }}</p>
          <p><strong>Status:</strong> {{ .Status }}</p>
          <p><strong>Started:</strong> {{ .StartsAt }}</p>
          {{ if .Labels.job }}<p><strong>Job:</strong> {{ .Labels.job }}</p>{{ end }}
          {{ end }}

  - name: 'service-email'
    email_configs:
      - to: '${ALERTMANAGER_EMAIL}'
        send_resolved: true
        headers:
          Subject: '[Service] Transcendance - {{ .GroupLabels.alertname }}'
        html: |
