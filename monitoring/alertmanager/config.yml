inhibit_rules:
  # Suppress warning alerts when critical alerts are firing for the same service
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']
  
  # Suppress individual service alerts when system-wide issues are detected
  - source_match:
      alertname: 'HighCPUUsage'
    target_match_re:
      alertname: 'HighResponseTime|HighErrorRate'
    equal: ['service']
  
  # Suppress performance alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: 'HighResponseTime|HighErrorRate'
    equal: ['service']
