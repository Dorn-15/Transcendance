global:
  resolve_timeout: 5m
  slack_api_url: ''

route:
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        component: database
      receiver: 'database-alerts'
    - match:
        component: system
      receiver: 'system-alerts'

receivers:
  - name: 'default'
    webhook_configs:
      - url: 'http://localhost:5001/webhook'
        send_resolved: true
  - name: 'critical-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/critical'
        send_resolved: true
  - name: 'database-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/database'
        send_resolved: true
  - name: 'system-alerts'
    webhook_configs:
      - url: 'http://localhost:5001/webhook/system'
        send_resolved: true

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'cluster', 'service']

