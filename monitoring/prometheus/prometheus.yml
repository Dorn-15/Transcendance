global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'transcendance'
    environment: 'production'

alerting:
  alertmanagers:
    - path_prefix: '/alertmanager/'
      static_configs:
        - targets:
          - 'alertmanager:9093'

rule_files:
  - '/etc/prometheus/alerts/*.yml'

scrape_configs:
  - job_name: 'prometheus'
    metrics_path: '/prometheus/metrics'
    static_configs:
      - targets: ['prometheus:9090']
        labels:
          service: 'prometheus'

  - job_name: 'node-exporter'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          service: 'node-exporter'
          exporter: 'system'

  - job_name: 'postgres-exporter'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres-exporter'
          exporter: 'postgresql'
          database: 'transcendance'

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis-exporter'
          exporter: 'redis'

  - job_name: 'nginx-exporter'
    static_configs:
      - targets: ['nginx-exporter:9113']
        labels:
          service: 'nginx'
          exporter: 'nginx'

  - job_name: 'auth-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['auth_service:4001']
        labels:
          service: 'auth-service'
          type: 'microservice'

  - job_name: 'game-service'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['game_service:4005']
        labels:
          service: 'game-service'
          type: 'microservice'

  - job_name: 'realtime-gateway'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['realtime_gateway:4004']
        labels:
          service: 'realtime-gateway'
          type: 'websocket-gateway'

  - job_name: 'frontend'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['frontend:3000']
        labels:
          service: 'frontend'
          type: 'frontend'
    scrape_interval: 30s

