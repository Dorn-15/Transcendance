map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

upstream frontend {
    server ${FRONT_HOST};
}

upstream api_realtime {
    server ${REALTIME_GATEWAY_HOST};
}

upstream prometheus {
    server ${PROMETHEUS_HOST};
}

upstream grafana {
    server ${GRAFANA_HOST};
}

upstream alertmanager {
    server ${ALERTMANAGER_HOST};
}

server {
    listen              443 ssl;
    ssl_certificate     /etc/nginx/ssl/selfsigned.crt;
    ssl_certificate_key /etc/nginx/ssl/selfsigned.key;

    proxy_set_header   Host $host;
    proxy_set_header   X-Real-IP $remote_addr;
    proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header   X-Forwarded-Proto $forwarded_proto;

    location ${FRONT_PATH} {
        proxy_pass         http://frontend;
    }

    location ${WS_PATH} {
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_pass         http://api_realtime/;
    }

    location /stub_status {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        allow 172.16.0.0/12; # Allow internal Docker network
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
    }

    # Monitoring Services
    location ${PROMETHEUS_PATH} {
        auth_basic           "Prometheus Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-prometheus;
        proxy_pass           http://prometheus;
    }

    location ${ALERTMANAGER_PATH} {
        auth_basic           "Alertmanager Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-alertmanager;
        proxy_pass           http://alertmanager;
    }

    location ${GRAFANA_PATH} {
        auth_basic           "Grafana Monitoring";
        auth_basic_user_file /etc/nginx/.htpasswd-grafana;
        proxy_pass           http://grafana;
    }
}
